<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#FEF3C7"/>
  <!-- Base Pedestal -->
  <rect x="160" y="380" width="180" height="40" rx="8" fill="#451A03"/>
  <!-- Ganesh Figurine Body -->
  <ellipse cx="250" cy="300" rx="60" ry="80" fill="url(#wood)" stroke="#451A03" stroke-width="3"/>
  <circle cx="250" cy="180" r="50" fill="url(#wood)" stroke="#451A03" stroke-width="3"/>
  <!-- Ears -->
  <ellipse cx="180" cy="180" rx="30" ry="40" fill="url(#wood)"/>
  <ellipse cx="320" cy="180" rx="30" ry="40" fill="url(#wood)"/>
  <!-- Trunk -->
  <path d="M 250,190 Q 220,240 260,260 Q 280,270 270,250" fill="none" stroke="url(#wood)" stroke-width="20" stroke-linecap="round"/>
  <!-- Crown -->
  <path d="M 220,135 L 250,70 L 280,135 Z" fill="#F59E0B"/>
</svg>
