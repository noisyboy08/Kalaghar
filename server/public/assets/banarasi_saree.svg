<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="silk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#7F1D1D"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#FFFDF7"/>
  <!-- Folded Silk Fabric -->
  <rect x="60" y="60" width="380" height="380" rx="16" fill="url(#silk)" filter="drop-shadow(0 20px 25px rgba(153,27,27,0.4))"/>
  <!-- Gold Zari Pallu Border -->
  <rect x="80" y="80" width="340" height="60" fill="#D97706"/>
  <rect x="80" y="360" width="340" height="60" fill="#D97706"/>
  <!-- Paisley Motifs -->
  <path d="M 150,250 Q 180,200 200,230 Q 210,260 170,270 Z" fill="#F59E0B"/>
  <path d="M 250,250 Q 280,200 300,230 Q 310,260 270,270 Z" fill="#F59E0B"/>
  <path d="M 350,250 Q 380,200 400,230 Q 410,260 370,270 Z" fill="#F59E0B"/>
</svg>
