<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="#F1F5F9"/>
  <!-- Left Earring -->
  <g transform="translate(160, 80)">
    <path d="M 90,30 Q 90,60 90,80" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <circle cx="90" cy="90" r="14" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <circle cx="90" cy="90" r="6" fill="#DC2626"/>
    <!-- Jhumka Dome -->
    <path d="M 40,150 Q 90,100 140,150 Z" fill="url(#silver)" stroke="#64748B" stroke-width="2"/>
    <path d="M 40,150 Q 90,170 140,150" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <!-- Filigree Lace Patterns -->
    <circle cx="90" cy="130" r="15" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Hanging Beads -->
    <circle cx="50" cy="180" r="5" fill="url(#silver)"/>
    <circle cx="70" cy="188" r="5" fill="url(#silver)"/>
    <circle cx="90" cy="192" r="6" fill="#DC2626"/>
    <circle cx="110" cy="188" r="5" fill="url(#silver)"/>
    <circle cx="130" cy="180" r="5" fill="url(#silver)"/>
  </g>
  <!-- Right Earring -->
  <g transform="translate(260, 110)">
    <path d="M 90,30 Q 90,60 90,80" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <circle cx="90" cy="90" r="14" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <circle cx="90" cy="90" r="6" fill="#DC2626"/>
    <path d="M 40,150 Q 90,100 140,150 Z" fill="url(#silver)" stroke="#64748B" stroke-width="2"/>
    <path d="M 40,150 Q 90,170 140,150" fill="none" stroke="url(#silver)" stroke-width="4"/>
    <circle cx="90" cy="130" r="15" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="50" cy="180" r="5" fill="url(#silver)"/>
    <circle cx="70" cy="188" r="5" fill="url(#silver)"/>
    <circle cx="90" cy="192" r="6" fill="#DC2626"/>
    <circle cx="110" cy="188" r="5" fill="url(#silver)"/>
    <circle cx="130" cy="180" r="5" fill="url(#silver)"/>
  </g>
</svg>
