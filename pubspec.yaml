name: kalaghar
description: "Kalaghar — multi-vendor artisan marketplace connecting buyers with skilled artisans across India."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.1.5 <4.0.0"

dependencies:
  bloc: ^8.1.2
  cached_network_image: ^3.3.0
  camera_camera: ^3.0.0
  carousel_slider: ^4.2.1
  cloudinary_public: ^0.21.0
  connectivity_plus: ^6.0.5
  cupertino_icons: ^1.0.2
  dotted_border: ^2.1.0
  equatable: ^2.0.5
  file_picker: ^6.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_dotenv: ^5.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_rating_bar: ^4.0.1
  flutter_secure_storage: ^9.2.2
  go_router: ^12.1.1
  google_fonts: ^6.2.1
  http: ^1.1.0
  hydrated_bloc: ^9.1.2
  intl: ^0.19.0
  path_provider: ^2.1.1
  razorpay_flutter: ^1.3.6
  rename: ^3.0.1
  shared_preferences: ^2.2.2
  syncfusion_flutter_charts: ^26.2.9
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  bloc_test: ^9.1.7
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/category_images/
    - assets/images/bottom_offers/
    - assets/images/bottom_nav_bar/
    - assets/images/product_quality_icons/
    - assets/images/cart_screen_icons/
    - config.env
